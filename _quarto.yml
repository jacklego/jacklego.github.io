project:
  type: website
  # Keeps year visibility in step with `currentYear` / `ptheme` in
  # _variables.yml. Stdlib-only, so Quarto can run it with any python3.
  pre-render:
    - scripts/sync_drafts.py
  resources:
    - "_favicon/"
    - "favicon.ico"


website:
  description: "Peter's Pumpkin Carvings"
  site-url: https://peterspumpkinpatch.org
  title: "Peter's Pumpkin Patch"
  favicon: _favicon/favicon.ico
  open-graph: true
  twitter-card: true
  # A season that isn't live yet renders at its real URLs -- so Peter can review
  # it -- but is excluded from every listing, the sitemap, search, and the feed.
  # `draft-mode` defaults to `gone`, so this has to be stated explicitly.
  # Which years are drafts is decided by scripts/sync_drafts.py.
  draft-mode: unlinked
  navbar:
    background: black
    left: 
      - text: "This Year's Patch"
        href: pumpkins/2025
      - text: "Pumpkins"
        href: pumpkins
      - text: "Non-Pumpkins"
        href: non-pumpkins
      - text: "Browse All"
        href: all-carvings
    # right:
    #   - icon: instagram
    #     href: https://instagram.com/
    #   - icon: twitter-x
    #     href: https://x.com
  page-footer: 
    background: $footer-bg
    left: "&#169; 2004 -- 2026 [Peter T. Wiegand](/about.qmd)"
    right: "Website by [Connor T. Wiegand](https://github.com/connortwiegand/){target='_blank'} <br/> Made with [Quarto](https://quarto.org/) | [Source code](https://github.com/jacklego/jacklego.github.io){target='blank'}"
  


format:
  html:
    theme: [darkly, sass/theme.scss]
    fontcolor: $body-color
    lightbox: true
    canonical-url: true
    include-in-header: 
      - "_favicon/head.html"

